name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build adapter ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - '1_18_2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test common
        run: ./gradlew :common:test --no-daemon

      - name: Build adapter
        run: ./gradlew :adapter:${{ matrix.adapter }}:build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xmautotool-${{ matrix.adapter }}
          path: adapter/${{ matrix.adapter }}/build/libs/*.jar
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
